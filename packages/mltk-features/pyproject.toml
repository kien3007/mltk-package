[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mltk-features"
version = "0.1.0"
description = "Feature engineering transformers with strict leakage prevention for MLTK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mltk-core",
]

[project.entry-points."mltk.transformers"]
datetime_features = "mltk_features.datetime:DatetimeFeatures"
ratio_features = "mltk_features.ratio:RatioFeatures"
group_agg_features = "mltk_features.group_agg:GroupAggFeatures"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
