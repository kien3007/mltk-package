[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mltk-selection"
version = "0.1.0"
description = "Feature selection transformers and metrics for MLTK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mltk-core",
]

[project.optional-dependencies]
shap = [
    "shap>=0.42.0",
]
dev = [
    "pytest>=7.0.0",
    "shap>=0.42.0",
]

[project.entry-points."mltk.transformers"]
variance_filter = "mltk_selection.filters:VarianceFilter"
missing_rate_filter = "mltk_selection.filters:MissingRateFilter"
correlation_filter = "mltk_selection.filters:CorrelationFilter"
stability_filter = "mltk_selection.filters:StabilityFilter"
importance_selector = "mltk_selection.importance:ModelImportanceSelector"
shap_selector = "mltk_selection.shap_selector:SHAPSelector"
