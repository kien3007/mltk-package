[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mltk-monitoring"
version = "0.1.0"
description = "Drift detection and production performance monitoring for MLTK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mltk-core",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
evidently = [
    "evidently>=0.4.0",
]
dev = [
    "pytest>=7.0.0",
]
