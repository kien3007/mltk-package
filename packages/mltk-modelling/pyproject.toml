[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mltk-modelling"
version = "0.1.0"
description = "Model training, hyperparameter tuning, evaluation and artifact lifecycle for MLTK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mltk-core",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "optuna>=3.3.0",
    "mlflow>=2.10.0",
    "skops>=0.9.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
