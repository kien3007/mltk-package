[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mltk-core"
version = "0.1.0"
description = "Core shared interfaces, contracts, logging and base classes for MLTK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandera>=0.18.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
