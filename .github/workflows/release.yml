name: Release

# Push a tag vX.Y.Z (matching mlkit.__version__) to publish a GitHub Release and, when enabled,
# upload the distribution "mltk-package" to PyPI. See docs/ROADMAP.md, section 2.4.
#
# PyPI uses trusted publishing (no token stored in the repo). One-time setup:
#   1. pypi.org -> Publishing -> add a pending publisher: owner kien3007, repository mltk-package,
#      workflow release.yml, environment pypi
#   2. GitHub repo -> Settings -> Environments: create "pypi"
#   3. GitHub repo -> Settings -> Variables: PUBLISH_PYPI = true
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-extras

      - name: Tag must match package version
        run: |
          PKG=$(uv run python -c "import mlkit; print(mlkit.__version__)")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$PKG tag=$TAG"
          test "$PKG" = "$TAG"

      - name: Quality gate (tests, benchmark, executable docs)
        env:
          MPLBACKEND: Agg
        run: |
          uv run ruff check src/ tests/ examples/
          uv run mypy src/mlkit
          uv run pytest tests/
          uv run pytest -m "benchmark or docs"

      - name: Build
        run: uv build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "mlkit $GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md for details."

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: release
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mltk-package/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
