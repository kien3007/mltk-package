name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check src/ tests/ examples/
      - name: Ruff format
        run: uv run ruff format --check src/ tests/ examples/
      - name: Mypy
        run: uv run mypy src/mlkit

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}
      - name: Tests with coverage gate
        run: uv run pytest tests/ --cov=mlkit --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  minimal-install:
    # Core package must import and train without any optional extras.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --no-dev
      - name: CLI smoke test (core deps only)
        run: |
          uv run mlkit steps
          uv run mlkit -q run examples/housing_config.yaml --out ./artifacts/housing
          uv run mlkit -q predict ./artifacts/housing examples/data/california_housing.csv --out ./artifacts/preds.csv
          uv run mlkit -q monitor ./artifacts/housing examples/data/california_housing.csv

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - name: Run example scripts
        env:
          MPLBACKEND: Agg
        run: |
          uv run python examples/adult_classification.py
          uv run python examples/california_regression.py
          uv run python examples/banking_multi_table_pipeline.py

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv build
      - name: Install wheel in a clean venv
        run: |
          uv venv /tmp/wheel-env
          uv pip install --python /tmp/wheel-env dist/*.whl
          /tmp/wheel-env/bin/mlkit steps
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
