[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlkit"
version = "0.1.0"
description = "A unified, production-ready 6-step tabular ML pipeline toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "scipy>=1.10.0",
    "lightgbm>=4.0.0",
    "xgboost>=2.0.0",
    "pandera>=0.18.0",
    "optuna>=3.0.0",
    "openpyxl>=3.1.5",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.optional-dependencies]
monitoring = ["evidently>=0.4.0"]
tracking = ["mlflow>=2.10.0"]

[project.scripts]
mlkit = "mlkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlkit"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".agent",
    ".venv",
    "artifacts",
    "reports",
    "examples/data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
