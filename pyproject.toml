[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlkit"
dynamic = ["version"]
description = "A unified, production-ready 6-step tabular ML pipeline toolkit"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "scipy>=1.10.0",
    "lightgbm>=4.0.0",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0.0"]
viz = ["matplotlib>=3.7.0", "seaborn>=0.12.0", "plotly>=5.24.1"]
explain = ["shap>=0.49.1", "matplotlib>=3.7.0"]
tuning = ["optuna>=3.0.0"]
tracking = ["mlflow>=2.10.0"]
serve = ["fastapi>=0.110.0", "uvicorn>=0.29.0"]
io = ["pyarrow>=14.0.0", "openpyxl>=3.1.5"]
all = [
    "xgboost>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.24.1",
    "shap>=0.49.1",
    "optuna>=3.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.5",
]

[project.scripts]
mlkit = "mlkit.cli:main"

[tool.hatch.version]
path = "src/mlkit/__init__.py"   # single source of truth for the package version

[tool.hatch.build.targets.wheel]
packages = ["src/mlkit"]

[tool.hatch.build.targets.sdist]
include = ["src/mlkit", "tests", "examples/*.py", "examples/*.yaml", "ADRs", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib -m 'not benchmark and not docs'"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
markers = [
    "slow: end-to-end tests on example datasets",
    "benchmark: multi-dataset generality suite (run with: pytest -m benchmark)",
    "docs: executes every code block of the user guide (run with: pytest -m docs)",
]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".agent",
    ".venv",
    "artifacts",
    "reports",
    "examples/data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "pandas-stubs>=2.0.0",
    "types-PyYAML>=6.0",
    "hypothesis>=6.100",
    "nbformat>=5.11.1",
    "nbclient>=0.11.0",
    "ipykernel>=7.3.0",
]

[tool.coverage.run]
source = ["mlkit"]
omit = ["*/serving.py", "*/tracking.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
